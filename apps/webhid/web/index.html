<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<title>Grillo Web HID</title>
<link rel="icon" href="/grillo.svg">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
:root{--acc:#4070ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:18px system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
/* 100dvh = actual visible height (without browser bars): no scrolling */
body{display:flex;flex-direction:column;padding:8px;gap:8px;height:100vh;height:100dvh;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{padding:0;min-width:0;min-height:48px;font-size:20px}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0}
#st{font-size:14px;color:var(--dim)}
#st.ok{color:var(--ok)}#st.bad{color:var(--err)}
#login{margin:auto;display:flex;flex-direction:column;gap:10px;width:min(260px,100%)}
#pin{padding:12px;font-size:28px;text-align:center;letter-spacing:6px}
#login button{background:var(--acc);color:#000;font-weight:600}
#msg{min-height:1.2em;color:var(--err);text-align:center;font-size:16px}
#app{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}
nav{display:flex;gap:6px}nav button{flex:1}
#pad{flex:1;min-height:120px;touch-action:none;display:flex;align-items:center;justify-content:center;color:var(--dim);user-select:none}
.row{display:flex;gap:6px}.row button{flex:1}
#keys{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}
/* 20px fields: mobile browsers zoom the page when a field with small text is tapped (16px threshold, extra margin for safety) */
input.live,textarea,select{font-size:20px}
input.live,textarea{width:100%;padding:12px;-webkit-user-select:text;user-select:text}
select{flex:1;min-width:0;min-height:48px;padding:0 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
/* The key grid takes all the remaining height and splits it into equal rows */
#sp,#fk{flex:1;min-height:0;grid-auto-rows:1fr}
#fk{display:none;grid-template-columns:repeat(4,1fr)}
#mods button{min-height:52px}
button.big{font-size:26px}
/* Phone in landscape: little height, lots of width. min-width is needed: with the on-screen keyboard
   open a phone in portrait has height < width and the browser would call it "landscape". Controls on the left, keys on the right.
   The [style*=flex] selector applies only when the tab is open (the tab is shown with inline display:flex) */
@media (max-height:480px) and (min-width:600px) and (orientation:landscape){
  header{display:none}
  #keys[style*="flex"]{display:grid!important;grid-template-columns:1fr 1.3fr;grid-template-rows:auto auto auto 1fr;gap:8px}
  #sel{grid-area:1/1}
  #keys>#live{grid-area:2/1}
  #mods{grid-area:3/1}
  #bot{grid-area:4/1;align-self:end}
  #sp,#fk{grid-area:1/2/5/3}
  button{min-height:40px}
}
/* On-screen keyboard open (little height): only what is needed for typing remains. Of the keys, only
   the first row is visible (Esc Tab Enter Bksp): rows after the first have height 0 and stay hidden. */
@media (max-height:430px){
  header,#sel,#fk,#bot{display:none!important}
  #sp{grid-template-rows:1fr;grid-auto-rows:0;overflow:hidden;gap:8px 8px;row-gap:0}
  #sp>button:nth-child(n+5){border:0;min-height:0}
}
#ov{display:none;position:fixed;inset:0;background:var(--bg);padding:8px;flex-direction:column;gap:8px;z-index:5}
#ov textarea{flex:1;resize:none}
</style>
</head>
<body>
<header><img class="logo" src="/grillo.svg" alt=""><h1>Web HID</h1><span id="st">offline</span><button id="theme" class="chip" type="button">Plain</button></header>

<form id="login">
  <input id="pin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN" autofocus>
  <button>Connect</button>
  <div id="msg"></div>
</form>

<div id="app">
  <nav><button id="t0" class="on">Touchpad</button><button id="t1">Keys</button></nav>
  <div id="pad0" style="display:contents">
    <div id="pad" class="panel">touchpad</div>
    <div class="row"><button id="bl">Left</button><button id="bm">Mid</button><button id="br">Right</button></div>
  </div>
  <div id="keys">
    <div class="row" id="sel">
      <select id="lay"><option value="it">IT</option><option value="us">US</option><option value="colemak">Colemak</option></select>
      <select id="os"><option value="windows">Windows</option><option value="linux">Linux</option><option value="mac">macOS</option></select>
    </div>
    <input class="live" id="live" placeholder="Type here" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="grid" id="mods"></div>
    <div class="grid" id="sp"></div>
    <div class="grid" id="fk"></div>
    <div class="row" id="bot"><button id="tf">F1–F12</button><button id="tp">Paste &amp; type</button></div>
  </div>
</div>

<div id="ov">
  <textarea id="paste" placeholder="Text to type on the PC"></textarea>
  <div class="row"><button id="oc">Close</button><button id="send" class="main">Type it</button></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const st = $("st");
let ws = null, pin = "", authed = false, retry = 0;
let mods = 0;

function setSt(t, c) { st.textContent = t; st.className = c || ""; }
function tx(s) { if (ws && ws.readyState === 1 && authed) ws.send(s); }

function connect() {
  ws = new WebSocket("ws://" + location.host + "/ws");
  setSt("connecting…");
  ws.onopen = () => ws.send("p" + pin);
  ws.onmessage = e => {
    const m = e.data;
    if (m === "ok") {
      authed = true; retry = 0; setSt("connected", "ok"); grilloLive(true);
      $("login").style.display = "none"; $("app").style.display = "flex";
    } else if (m === "no") { fail("Wrong PIN"); }
    else if (m === "busy") { fail("Another client is connected"); }
    else if (m === "locked") { fail("Too many tries, wait 30 s"); }
    else if (m[0] === "L") { const [l, o] = m.slice(1).split(" "); $("lay").value = l; $("os").value = o; labelMods(); }
    else if (m === "nohost") { setSt("PC not ready", "bad"); }
    else if (m === "hostok") { setSt("connected", "ok"); }
    else if (m.startsWith("untypeable")) { setSt(m.slice(11) + " char(s) not in layout: typed ?", "bad"); }
  };
  ws.onclose = () => {
    const was = authed; authed = false; grilloLive(false);
    if (!pin) return;
    setSt("offline", "bad");
    // Retry as long as there is a PIN to use: a rejection (wrong PIN, busy, locked) goes through
    // fail(), which clears it. Previously it retried only if the last connection was authenticated,
    // so a failed retry (WiFi not back yet) stopped everything.
    if (was) retry = 0;
    setTimeout(connect, Math.min(1000 * ++retry, 5000));
  };
}
function fail(t) { pin = ""; $("msg").textContent = t; $("login").style.display = ""; $("app").style.display = "none"; setSt("offline", "bad"); if (ws) ws.close(); }

// Without a PIN (webhid.pin = false) we get in right away. "-" is a placeholder: the
// server accepts it because it compares nothing.
fetch("/cfg").then(r => r.text()).then(t => { if (t === "nopin") { pin = "-"; connect(); } }).catch(() => {});

$("login").onsubmit = e => { e.preventDefault(); pin = $("pin").value.trim(); $("msg").textContent = ""; if (pin) connect(); };

// On macOS the modifiers have other names: same HID keys, different labels
const MAC_NAMES = {1: "Ctrl", 4: "Opt", 2: "Shift", 8: "Cmd"};
function labelMods() {
  const mac = $("os").value === "mac";
  for (const b of $("mods").children) {
    const m = +b.dataset.m;
    b.textContent = mac ? MAC_NAMES[m] : MODS.find(x => x[1] === m)[0];
  }
}
$("lay").onchange = e => tx("l" + e.target.value);
$("os").onchange = e => { tx("o" + e.target.value); labelMods(); };

// --- Tabs ---
function tab(n) {
  $("pad0").style.display = n ? "none" : "contents";
  $("keys").style.display = n ? "flex" : "none";
  $("t0").classList.toggle("on", !n); $("t1").classList.toggle("on", !!n);
}
$("t0").onclick = () => tab(0); $("t1").onclick = () => tab(1);

// --- Touchpad: 1 finger moves, tap = click, 2 fingers scroll, 2-finger tap = right click ---
const pad = $("pad"), ptrs = new Map();
let acc = {x: 0, y: 0}, sacc = 0, moved = 0, t0 = 0, maxFingers = 0, timer = 0, btnHeld = 0;
function flush() {
  timer = 0;
  const dx = Math.trunc(acc.x), dy = Math.trunc(acc.y);
  if (dx || dy) { tx("m" + dx + " " + dy); acc.x -= dx; acc.y -= dy; }
  const w = Math.trunc(sacc);
  if (w) { tx("w" + (-w)); sacc -= w; }
}
function queue() { if (!timer) timer = setTimeout(flush, 16); }
pad.onpointerdown = e => {
  pad.setPointerCapture(e.pointerId);
  if (!ptrs.size) { moved = 0; t0 = e.timeStamp; maxFingers = 0; }
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  maxFingers = Math.max(maxFingers, ptrs.size);
};
pad.onpointermove = e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size >= 2) { sacc += dy / 12; }   // 12 px of finger = 1 notch
  else { acc.x += dx * 1.6; acc.y += dy * 1.6; } // fixed acceleration
  queue();
};
function up(e) {
  if (!ptrs.delete(e.pointerId)) return;
  if (!ptrs.size && moved < 8 && e.timeStamp - t0 < 250) {
    const b = maxFingers >= 2 ? 2 : 1;
    tx("b" + b); tx("b0");
  }
}
pad.onpointerup = up; pad.onpointercancel = up;
for (const [id, mask] of [["bl", 1], ["br", 2], ["bm", 4]]) {
  const b = $(id);
  b.onpointerdown = e => { b.setPointerCapture(e.pointerId); btnHeld |= mask; tx("b" + btnHeld); };
  const rel = () => { btnHeld &= ~mask; tx("b" + btnHeld); };
  b.onpointerup = rel; b.onpointercancel = rel;
}

// --- Keys ---
const MODS = [["Ctrl", 1], ["Alt", 4], ["Shift", 2], ["Win", 8]];
const SPECIAL = [["Esc", 0x29], ["Tab", 0x2B], ["Enter", 0x28], ["Bksp", 0x2A],
  ["Del", 0x4C], ["Home", 0x4A], ["End", 0x4D], ["PgUp", 0x4B],
  ["←", 0x50], ["↑", 0x52], ["↓", 0x51], ["→", 0x4F],
  ["Ins", 0x49], ["PgDn", 0x4E], ["PrtSc", 0x46], ["Menu", 0x65]];
function key(usage) { tx("k" + mods + " " + usage); clearMods(); }
function clearMods() { mods = 0; for (const b of $("mods").children) b.classList.remove("on"); }
for (const [n, m] of MODS) {
  const b = document.createElement("button"); b.textContent = n; b.dataset.m = m;
  b.onclick = () => { mods ^= m; b.classList.toggle("on", !!(mods & m)); };
  $("mods").appendChild(b);
}
for (const [n, u] of SPECIAL) {
  const b = document.createElement("button"); b.textContent = n; if (n.length === 1) b.className = "big"; b.onclick = () => key(u); $("sp").appendChild(b);
}
for (let i = 1; i <= 12; i++) {
  const b = document.createElement("button"); b.textContent = "F" + i; b.onclick = () => key(0x39 + i - 1); $("fk").appendChild(b);
}
// Only one panel at a time (special keys or F1-F12): both at full screen would be too tall
$("tf").onclick = () => {
  const f = $("fk").style.display !== "grid";
  $("fk").style.display = f ? "grid" : "none"; $("sp").style.display = f ? "none" : "grid";
  $("tf").classList.toggle("on", f); $("tf").textContent = f ? "Keys" : "F1–F12";
};
$("tp").onclick = () => { $("ov").style.display = "flex"; $("paste").focus(); };
$("oc").onclick = () => { $("ov").style.display = "none"; };

// "live" field: mirrors the field's text on the PC. On every input the new
// value is compared with the previous one: the part that changed is deleted
// (backspace) and the rest is typed. This way autocorrect, suggestions and
// the phone keyboard's composition do not produce repetitions, because
// the PC always receives only the difference.
// The field starts with an invisible sentinel character: this way a backspace at
// the start of the field still generates an input (on an empty field it would not).
const S = "\u200b", live = $("live");
let prev = S;
function reset() { live.value = S; prev = S; }
function end() { const n = live.value.length; live.setSelectionRange(n, n); }
function sync() {
  const cur = live.value;
  const a = Array.from(prev), b = Array.from(cur);
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  const del = a.length - i, add = b.slice(i).join("").split(S).join("");
  // The dongle accepts at most 500 backspaces per command
  for (let d = del; d > 0; d -= 500) tx("e" + Math.min(d, 500));
  if (add) {
    if (mods) { for (const ch of add) tx("c" + mods + " " + ch); clearMods(); }
    else tx("t" + add);
  }
  prev = cur;
  // If the sentinel was deleted, restore it (the backspace has already been sent)
  if (!cur.startsWith(S)) { reset(); return; }
  // Long field and no composition in progress: start over, so it does not grow without bound
  if (cur.length > 300 && !composing) reset();
  end();
}
let composing = false;
live.addEventListener("compositionstart", () => { composing = true; });
live.addEventListener("compositionend", () => { composing = false; sync(); });
live.addEventListener("input", sync);
live.addEventListener("focus", () => { if (!live.value) reset(); end(); });
live.addEventListener("click", end);
live.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); key(0x28); reset(); }
  else if (e.key.startsWith("Arrow")) {
    e.preventDefault();
    key({ArrowLeft: 0x50, ArrowRight: 0x4F, ArrowUp: 0x52, ArrowDown: 0x51}[e.key]);
  }
});
reset();

// Paste and type: 400-character chunks, to stay under the firmware's frame limit
$("send").onclick = () => {
  const t = $("paste").value;
  for (let i = 0; i < t.length; i += 400) tx("t" + t.slice(i, i + 400));
  $("ov").style.display = "none";
};
</script>
</body>
</html>
