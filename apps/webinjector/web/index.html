<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grillo Web Injector</title>
<link rel="icon" href="/grillo.svg">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
:root{--acc:#b060ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{display:flex;flex-direction:column;padding:8px;gap:8px;min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{min-height:48px;padding:0 12px}
header{display:flex;align-items:center}
#st{font-size:12px;color:var(--dim)}
#st.ok{color:var(--ok)}#st.bad{color:var(--err)}
#login{margin:auto;display:flex;flex-direction:column;gap:10px;width:min(260px,100%)}
#pin{padding:12px;font-size:28px;text-align:center;letter-spacing:6px}
#msg{min-height:1.2em;color:var(--err);text-align:center;font-size:16px}
#app{display:none;flex-direction:column;gap:8px}
nav{display:flex;gap:6px}nav button{flex:1}
#where{color:var(--dim);font-size:15px;min-height:1.2em;overflow-wrap:anywhere}
#list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%}
.item .r{color:var(--dim);font-size:14px;white-space:nowrap}
.item.dir .l{color:var(--acc)}
.l{overflow-wrap:anywhere}
.note{color:var(--warn);font-size:15px}
.panel{padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:16px;color:var(--acc);overflow-wrap:anywhere}
.info{color:var(--dim);font-size:15px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
.err{color:var(--err);overflow-wrap:anywhere}
.row{display:flex;gap:8px}.row button{flex:1}
.col{display:flex;flex-direction:column;gap:8px}
#run{display:none}
#bar{height:10px;background:var(--hi);overflow:hidden;display:none}
#bar div{height:100%;width:0;background:var(--acc)}
/* Cronologia: una voce per riga, ora a sinistra */
#log{margin:0;padding:0;list-style:none;max-height:50vh;overflow:auto;font-size:15px;display:flex;flex-direction:column;gap:2px}
#log li{display:flex;gap:8px;overflow-wrap:anywhere;min-width:0}
#log .at{flex:none;color:var(--dim);font-family:var(--f-mono);font-size:13px;padding-top:2px}
#log .x{min-width:0}
#log .status{color:var(--dim)}
#log .ask,#log .answer,#log .start{color:var(--acc)}
#log .done.ok{color:var(--ok)}#log .done.bad{color:var(--err)}
#log .note{font-style:italic}
#result{display:none;padding:8px;border:2px solid var(--hi)}
#result.ok{border-color:var(--ok)}#result.bad{border-color:var(--err)}
#result b{display:block}
#vlast{display:none}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);padding:16px;align-items:center;justify-content:center;z-index:5}
#ov .panel{width:min(420px,100%);max-height:90vh;overflow:auto}
#toast{position:fixed;left:8px;right:8px;bottom:8px;display:none;background:var(--err);color:#000;clip-path:var(--notch);padding:10px;z-index:60}
/* Barra a blocchi in arcade */
html.arcade #bar div{background:repeating-linear-gradient(90deg,var(--acc) 0 8px,transparent 8px 10px)}
</style>
</head>
<body>
<header><img class="logo" src="/grillo.svg" alt=""><h1>Web Injector</h1><span id="st">offline</span><button id="theme" class="chip" type="button">Plain</button></header>

<form id="login">
  <input id="pin" inputmode="numeric" autocomplete="off" placeholder="PIN" maxlength="6">
  <button class="main">Connect</button>
  <div id="msg"></div>
</form>

<div id="app">
  <section id="run" class="panel">
    <h2 id="rname"></h2>
    <div id="rstatus" class="desc"></div>
    <div id="bar"><div></div></div>
    <div id="result"></div>
    <div class="row">
      <button id="abort" class="danger">Abort</button>
      <button id="rok" class="main" title="Close the result on the dongle display">OK</button>
      <button id="rback">Back</button>
      <button id="ragain">Run again</button>
    </div>
    <ol id="log"></ol>
  </section>
  <div id="browse" class="col">
    <nav><button id="v0" class="on">Folders</button><button id="v1">By OS</button><button id="v2">By tag</button><button id="vlast">Last run</button></nav>
    <div id="where"></div>
    <div id="list"></div>
  </div>
</div>

<div id="ov"><div class="panel" id="box"></div></div>
<div id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let ws = null, pin = "", authed = false, retry = 0;

function setSt(t, c) { $("st").textContent = t; $("st").className = c || ""; }
function tx(s) { if (ws && ws.readyState === 1 && authed) ws.send(s); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function toast(t) { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 4000); }

// --- Connessione: come il Web HID (PIN, riconnessione automatica) ---
function connect() {
  ws = new WebSocket("ws://" + location.host + "/ws");
  setSt("connecting…");
  ws.onopen = () => ws.send("p" + pin);
  ws.onmessage = e => {
    const m = e.data;
    if (m === "ok") {
      authed = true; retry = 0; setSt("connected", "ok"); grilloLive(true);
      $("login").style.display = "none"; $("app").style.display = "flex";
    } else if (m === "no") fail("Wrong PIN");
    else if (m === "busy") fail("Another client is connected");
    else if (m === "locked") fail("Too many tries, wait 30 s");
    else if (m[0] === "{") handle(JSON.parse(m));
  };
  ws.onclose = () => {
    const was = authed; authed = false; grilloLive(false);
    if (!pin) return;
    setSt("offline", "bad");
    if (was) retry = 0;
    setTimeout(connect, Math.min(1000 * ++retry, 5000));
  };
}
function fail(t) { pin = ""; $("msg").textContent = t; $("login").style.display = ""; $("app").style.display = "none"; setSt("offline", "bad"); if (ws) ws.close(); }
fetch("/cfg").then(r => r.text()).then(t => { if (t === "nopin") { pin = "-"; connect(); } }).catch(() => {});
$("login").onsubmit = e => { e.preventDefault(); pin = $("pin").value.trim(); $("msg").textContent = ""; if (pin) connect(); };

// --- Messaggi del dongle ---
// phase: "idle" | "run" | "done" (esito ancora sul display, resultId)
let entries = [], dialogId = 0, phase = "idle", resultId = 0, lastPath = "", pendingRun = "";
function handle(m) {
  switch (m.t) {
  case "hello":
    // Dopo hello arrivano cronologia, stato, dialogo ed esito: si riparte da zero
    phase = m.phase; resultId = 0; clearRun();
    if (m.dropped) logItem("note", "", m.dropped + " earlier lines not kept");
    if (phase !== "idle") showRun(true);
    else { hideDialog(); if (!runShown()) showRun(false); }
    refresh(); buttons();
    break;
  case "entry": entries.push(m); break;
  case "end": listDone(m); break;
  case "meta": showCard(m); break;
  case "state": phase = "run"; showRun(true); runState(m); buttons(); break;
  case "log":
    if (m.k === "start") { clearRun(); $("rname").textContent = m.text; }
    logItem(m.k, m.at, m.text);
    break;
  case "menu": case "confirm": case "button": showDialog(m); break;
  // Esito: in pagina, non in una finestra. "done" è anche sul display (OK lo chiude)
  case "done": phase = "done"; resultId = m.id; showResult(m); break;
  case "result": showResult(m); break;
  case "close":
    if (m.id === dialogId) hideDialog();
    if (m.id === resultId) { resultId = 0; buttons(); }
    break;
  case "idle":
    phase = "idle"; resultId = 0; refresh(); buttons();
    if (pendingRun) { tx("r" + pendingRun); pendingRun = ""; }
    break;
  case "error": loading = false; pendingRun = ""; toast(m.text); break;
  }
}

// --- Elenco: cartelle vere, oppure viste per OS e per tag da tutti gli script ---
let view = 0, dir = "", group = null, loading = false, scan = [];
for (const i of [0, 1, 2]) $("v" + i).onclick = () => { view = i; group = null; refresh(); };
function refresh() {
  for (const i of [0, 1, 2]) $("v" + i).classList.toggle("on", view === i);
  if (loading) return;
  loading = true; entries = [];
  // Le viste virtuali si costruiscono qui dalla scansione completa, come fa l'Injector sul display
  tx(view === 0 ? "l" + dir : "s");
}
function listDone(m) {
  loading = false;
  const list = $("list"); list.textContent = "";
  if (m.full) list.appendChild(el("div", "note", "Only 48 items: use subfolders"));
  if (view === 0) {
    $("where").textContent = "/payloads" + (dir ? "/" + dir : "");
    if (dir) addItem("..", "", true, () => { dir = dir.includes("/") ? dir.slice(0, dir.lastIndexOf("/")) : ""; refresh(); });
    for (const e of entries) {
      const path = dir ? dir + "/" + e.name : e.name;
      if (e.dir) addItem(e.title, "", true, () => { dir = path; refresh(); });
      else addItem(e.title, e.layout + "/" + e.os.slice(0, 3), false, () => tx("m" + path));
    }
    if (!entries.length) list.appendChild(el("div", "info", "No scripts here"));
    return;
  }
  scan = entries;
  const key = view === 1 ? (e => [e.os]) : (e => e.tags.split(/[\s,]+/).filter(Boolean).map(t => t.toLowerCase()));
  if (group === null) {
    $("where").textContent = view === 1 ? "By OS" : "By tag";
    const count = new Map();
    for (const e of scan) for (const k of key(e)) count.set(k, (count.get(k) || 0) + 1);
    for (const k of [...count.keys()].sort()) addItem(k, String(count.get(k)), true, () => { group = k; listDone({}); });
    if (!count.size) list.appendChild(el("div", "info", view === 1 ? "No scripts" : "No @tags in scripts"));
    return;
  }
  $("where").textContent = (view === 1 ? "By OS / " : "By tag / ") + group;
  addItem("..", "", true, () => { group = null; listDone({}); });
  for (const e of scan) if (key(e).includes(group)) addItem(e.title, view === 1 ? e.layout : e.layout + "/" + e.os.slice(0, 3), false, () => tx("m" + e.path));
}
function addItem(label, right, isDir, onclick) {
  const b = el("button", "item" + (isDir ? " dir" : ""));
  b.appendChild(el("span", "l", (isDir && label !== ".." ? "/" : "") + label));
  b.appendChild(el("span", "r", right));
  b.onclick = onclick;
  $("list").appendChild(b);
}

// --- Scheda dello script ---
function showCard(m) {
  const box = $("box"); box.textContent = "";
  box.appendChild(el("h2", "", m.name || m.path));
  let info = m.layout + " · " + m.os;
  if (m.tags) info += " · " + m.tags;
  if (m.timeout > 0) info += " · timeout " + m.timeout + " s";
  box.appendChild(el("div", "info", info));
  if (m.desc) box.appendChild(el("div", "desc", m.desc));
  if (m.error) box.appendChild(el("div", "err", m.error));
  const row = el("div", "row");
  const back = el("button", "", "Back"); back.onclick = hideDialog;
  row.appendChild(back);
  if (!m.error) {
    const run = el("button", "main", "Run");
    run.onclick = () => { hideDialog(); tx("r" + m.path); };
    row.appendChild(run);
  }
  box.appendChild(row);
  dialogId = 0;
  $("ov").style.display = "flex";
}

// --- Esecuzione: resta in pagina anche a run finita, fino a Back ---
function showRun(on) {
  $("run").style.display = on ? "flex" : "none";
  $("browse").style.display = on ? "none" : "flex";
  // "block" e non "": il CSS lo nasconde finché non c'è una run da rivedere
  $("vlast").style.display = !on && $("log").children.length ? "block" : "none";
}
const runShown = () => $("run").style.display === "flex";
function clearRun() {
  $("log").textContent = ""; $("result").style.display = "none"; $("bar").style.display = "none";
  $("rstatus").textContent = "";
}
function buttons() {
  const ended = phase !== "run" && $("result").style.display !== "none";
  $("abort").style.display = phase === "run" ? "" : "none";
  $("rok").style.display = resultId ? "" : "none";
  $("rback").style.display = $("ragain").style.display = ended ? "" : "none";
}
function showResult(m) {
  lastPath = m.path;
  const r = $("result"); r.textContent = ""; r.className = m.ok ? "ok" : "bad"; r.style.display = "block";
  r.appendChild(el("b", "", m.ok ? "Done" : m.aborted ? "Aborted" : m.timeout ? "Timeout" : "Error"));
  if (!m.ok && !m.aborted && !m.timeout) r.appendChild(el("div", "err", m.error || "failed"));
  $("rname").textContent = m.name; $("rstatus").textContent = ""; $("bar").style.display = "none";
  buttons();
}
// Chiude l'esito sul display, se c'è ancora
function dismiss() { if (resultId) tx("a" + resultId + ":0"); }
$("rok").onclick = dismiss;
$("rback").onclick = () => { dismiss(); showRun(false); };
$("ragain").onclick = () => {
  // Con l'esito ancora sul display il dongle non accetta una run nuova: prima si chiude
  if (resultId) { pendingRun = lastPath; dismiss(); } else tx("r" + lastPath);
};
$("vlast").onclick = () => showRun(true);
function runState(m) {
  $("rname").textContent = m.name;
  $("rstatus").textContent = m.wait ? "Waiting for the USB host…" : m.status;
  $("bar").style.display = m.max > 0 ? "block" : "none";
  if (m.max > 0) $("bar").firstChild.style.width = Math.max(0, Math.min(100, 100 * m.p / m.max)) + "%";
}
function logItem(k, at, text) {
  const log = $("log");
  // In fondo segue le voci nuove; se si sta rileggendo più su, resta lì
  const atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const li = el("li", k + (k === "done" ? (text === "Done" ? " ok" : " bad") : ""));
  li.appendChild(el("span", "at", at)); li.appendChild(el("span", "x", text));
  log.appendChild(li);
  // Ultime 300 voci: lo script può scrivere per ore
  while (log.children.length > 300) log.firstChild.remove();
  if (atEnd) log.scrollTop = log.scrollHeight;
  if (!runShown()) $("vlast").style.display = "block";
}
$("abort").onclick = () => tx("x");

// --- Dialoghi dello script: rispondere qui o col pulsante del dongle, vale il primo ---
function showDialog(m) {
  const box = $("box"); box.textContent = "";
  dialogId = m.id;
  const answer = v => () => { tx("a" + m.id + ":" + v); hideDialog(); };
  const col = el("div", "col");
  if (m.t === "menu") {
    box.appendChild(el("h2", "", m.title));
    m.items.forEach((it, i) => { const b = el("button", "item", it); b.onclick = answer(i); col.appendChild(b); });
  } else if (m.t === "confirm") {
    box.appendChild(el("h2", "", m.title));
    box.appendChild(el("div", "desc", m.text));
    const row = el("div", "row");
    const no = el("button", m.yes ? "" : "main", "No"); no.onclick = answer(0);
    const yes = el("button", m.yes ? "main" : "", "Yes"); yes.onclick = answer(1);
    row.appendChild(no); row.appendChild(yes); col.appendChild(row);
  } else {
    box.appendChild(el("h2", "", "Waiting for the button"));
    const row = el("div", "row");
    ["Click", "Double", "Long"].forEach((n, i) => { const b = el("button", "", n); b.onclick = answer(i); row.appendChild(b); });
    col.appendChild(row);
  }
  box.appendChild(col);
  $("ov").style.display = "flex";
}
function hideDialog() { $("ov").style.display = "none"; dialogId = 0; }
</script>
</body>
</html>
